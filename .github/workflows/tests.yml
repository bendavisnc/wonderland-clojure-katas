
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            alphabet-cipher:
              - 'alphabet-cipher/**'
            card-game-war:
              - 'card-game-war/**'
            doublets:
              - 'doublets/**'
            fox-goose-bag-of-corn:
              - 'fox-goose-bag-of-corn/**'
            magic-square:
              - 'magic-square/**'
            tiny-maze:
              - 'tiny-maze/**'
            wonderland-number:
              - 'wonderland-number/**'

      - name: Test alphabet-cipher
        if: steps.changes.outputs.alphabet-cipher == 'true'
        working-directory: alphabet-cipher
        run: clojure -X:test

      - name: Test card-game-war
        if: steps.changes.outputs.card-game-war == 'true'
        working-directory: card-game-war
        run: clojure -X:test

      - name: Test doublets
        if: steps.changes.outputs.doublets == 'true'
        working-directory: doublets
        run: clojure -X:test

      - name: Test fox-goose-bag-of-corn
        if: steps.changes.outputs.fox-goose-bag-of-corn == 'true'
        working-directory: fox-goose-bag-of-corn
        run: clojure -X:test

      - name: Test magic-square
        if: steps.changes.outputs.magic-square == 'true'
        working-directory: magic-square
        run: clojure -X:test

      - name: Test tiny-maze
        if: steps.changes.outputs.tiny-maze == 'true'
        working-directory: tiny-maze
        run: clojure -X:test

      - name: Test wonderland-number
        if: steps.changes.outputs.wonderland-number == 'true'
        working-directory: wonderland-number
        run: clojure -X:test